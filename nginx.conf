server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    types {
        application/manifest+json webmanifest;
    }
    include /etc/nginx/mime.types;

    # Service worker, its registration script and the manifest must never be
    # cached, otherwise installed PWAs will not pick up new versions
    location ~* ^/(sw\.js|registerSW\.js|manifest\.webmanifest|index\.html)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Hashed build assets can be cached forever
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Missing files are real 404s, not the app shell
    location ~* \.[a-z0-9]+$ {
        try_files $uri =404;
    }

    # Client-side routes fall back to the app shell
    location / {
        try_files $uri $uri/ /index.html;
    }
}
